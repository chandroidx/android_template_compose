[versions]
applicationName = "Android Template Compose"
applicationId = "com.chandroidx.android"
minSdk = "24"
targetSdk = "36"
compileSdk = "36"
versionCode = "1"
versionName = "1.0.0"

kotlin = "2.3.10"
kotlinSerialization = "1.10.0"
ksp = "2.3.5"
coreKtx = "1.17.0"
activityCompose = "1.12.3"
composeBom = "2026.01.01"
composeNavigation3 = "1.0.0"
composeNavigation3-viewModel = "2.10.0"
composeExtensions = "25.5.1"
coroutine = "1.10.2"
ktor = "3.4.0"
immutable = "0.4.0"
sandwich = "2.2.1"
hilt = "2.59.1"
hiltNavigation = "1.3.0"
spotless = "8.2.1"
splash = "1.2.0"
lifecycleRuntimeCompose = "2.10.0"
agp = "9.0.0"
cameraX = "1.5.2"
textRecognition = "16.0.1"
barcodeScanning = "17.3.0"
faceDetection = "16.1.7"
faceMeshDetection = "16.0.0-beta3"
imageLabeling = "17.0.9"
objectDetection = "17.0.2"
digitalInkRecognition = "19.0.0"
poseDetection = "18.0.0-beta5"
selfieSegmentation = "16.0.0-beta6"
accompanistPermission = "0.37.3"

[libraries]
# Android
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
splashScreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splash" }

# Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "composeNavigation3" }
androidx-compose-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "composeNavigation3" }
androidx-compose-navigation3-viewModel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "composeNavigation3-viewModel" }

androidx-hiltNavigationCompose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigation" }
compose-extensions = { group = "tech.thdev", name = "extensions-compose-system-ui-controller", version.ref = "composeExtensions" }
androidx-lifecycleRuntimeCompose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }

# Kotlin
kotlinx-coroutine-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutine" }
kotlinx-collections-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "immutable" }
kotlinx-serialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinSerialization" }

# Network
ktor-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-serialization = { group = "io.ktor", name = "ktor-client-serialization", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-logging = { group = "io.ktor", name = "ktor-client-logging-jvm", version.ref = "ktor" }
ktor-contentNegotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
sandwich = { group = "com.github.skydoves", name = "sandwich-ktor", version.ref = "sandwich" }

# DI
hilt = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-javax = { group = "javax.inject", name = "javax.inject", version = "1" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

# Gradle Plugins
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

# CameraX
cameraX-core = { group = "androidx.camera", name = "camera-core", version.ref = "cameraX" }
cameraX-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "cameraX" }
cameraX-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "cameraX" }
cameraX-view = { group = "androidx.camera", name = "camera-view", version.ref = "cameraX" }
cameraX-extensions = { group = "androidx.camera", name = "camera-extensions", version.ref = "cameraX" }
cameraX-mlkit-vision = { group = "androidx.camera", name = "camera-mlkit-vision", version.ref = "cameraX" }

# MLKit
mlkit-textRecognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "textRecognition" }
mlkit-barcodeScanning = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "barcodeScanning" }
mlkit-faceDetection = { group = "com.google.mlkit", name = "face-detection", version.ref = "faceDetection" }
mlkit-faceMeshDetection = { group = "com.google.mlkit", name = "face-mesh-detection", version.ref = "faceMeshDetection" }
mlkit-imageLabeling = { group = "com.google.mlkit", name = "image-labeling", version.ref = "imageLabeling" }
mlkit-objectDetection = { group = "com.google.mlkit", name = "object-detection", version.ref = "objectDetection" }
mlkit-digitalInkRecognition = { group = "com.google.mlkit", name = "digital-ink-recognition", version.ref = "digitalInkRecognition" }
mlkit-poseDetection = { group = "com.google.mlkit", name = "pose-detection", version.ref = "poseDetection" }
mlkit-selfieSegmentation = { group = "com.google.mlkit", name = "segmentation-selfie", version.ref = "selfieSegmentation" }

accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanistPermission" }

[bundles]
compose = ["androidx-compose-foundation", "androidx-compose-material3", "androidx-compose-runtime", "androidx-compose-ui", "androidx-compose-ui-graphics", "androidx-compose-ui-tooling", "androidx-compose-ui-tooling-preview", "androidx-compose-activity", "androidx-compose-navigation3-runtime", "androidx-compose-navigation3-ui", "androidx-hiltNavigationCompose", "compose-extensions", "androidx-compose-animation", "androidx-lifecycleRuntimeCompose"]
ktor = ["ktor-okhttp", "ktor-serialization", "ktor-serialization-kotlinx-json", "ktor-contentNegotiation", "ktor-logging", "sandwich"]
cameraX = ["cameraX-core", "cameraX-camera2", "cameraX-lifecycle", "cameraX-view", "cameraX-extensions", "cameraX-mlkit-vision"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

chandroidx-presentation = { id = "com.chandroidx.presentation.plugin" }
chandroidx-jvm = { id = "com.chandroidx.jvm.plugin" }
chandroidx-android = { id = "com.chandroidx.android.plugin" }
chandroidx-hilt = { id = "com.chandroidx.hilt.plugin" }
chandroidx-compose = { id = "com.chandroidx.compose.plugin" }